coverage:
  status:
    project:
      default:
        threshold: 0.10%
      pigly:
        flags: pigly
      transformer:
        flags: transformer
    patch: off

flags:
  pigly:
    paths:
      - packages/pigly/
  transformer:
    paths:
      - packages/pigly-transformer/

comment:
  layout: "reach,diff,flags,tree"
  behavior: default
  require_changes: false
